schema_version: 0.1.0
project: underwater_hexapod
units:
  length: m
  angle: rad
  mass: kg
  force: N
  torque: N_m

frames:
  convention: right_handed
  base_link:
    x: forward
    y: left
    z: up
  world:
    z: up

robot:
  mass_policy: unit_mass_per_rigid_component
  component_mass_kg: 1.0
  total_mass_kg: 20.0
  nominal_body_height_m: 0.35
  buoyancy_center_in_base_m: [TBD, TBD, TBD]
  center_of_mass_in_base_m: [TBD, TBD, TBD]

base_fold:
  mechanism_description: rear plate folds upward 90 degrees, opposite to the downward-pointing legs
  joints:
    - name: base_fold
      axis_in_parent: [0.0, 1.0, 0.0]
      range_rad: [0.0, 1.5708]
      velocity_command_range_rad_s: [-1.0, 1.0]
      max_torque_N_m: TBD

legs:
  names: [lf, lm, lr, rf, rm, rr]
  mounting:
    front_plate_pairs: [front, middle]
    rear_plate_pairs: [rear]
  dof_per_leg: 2
  joint_template:
    - suffix: j1
      type: hinge
      axis_in_parent: [0.0, 1.0, 0.0]
      range_rad: [-1.57, 1.57]
      zero_definition: upper link points down
      velocity_command_range_rad_s: [-1.0, 1.0]
      max_torque_N_m: TBD
    - suffix: j2
      type: hinge
      axis_in_parent: [0.0, 1.0, 0.0]
      range_rad: [-1.57, 1.57]
      zero_definition: lower link is collinear with upper link and points down
      velocity_command_range_rad_s: [-1.0, 1.0]
      max_torque_N_m: TBD
  geometry:
    link_lengths_m: [0.14, 0.16]
    mesh_scale: [1.0, 1.0, 1.0]

adhesion:
  technology: electromagnetic_switch
  command_values: [off, on]
  normal_force_limit_N: 20.0
  tangential_force_limit_N: TBD
  engage_delay_s: TBD
  release_delay_s: TBD
  max_contact_gap_m: TBD
  max_surface_angle_rad: TBD
  failure_behavior: TBD

environment_assumptions:
  ground_friction: TBD
  wall_friction: TBD
  fluid_model: disabled_in_stage_1

ownership:
  mechanical_fields_owner: mechanical_team
  control_fields_owner: intelligence_team
  interface_approval: both_teams

